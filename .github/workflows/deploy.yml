name: Build en deploy naar GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimale rechten; alleen de deploy-job krijgt Pages-schrijfrechten.
permissions:
  contents: read

# Een lopende Pages-deploy niet halverwege afbreken; PR-builds mogen wel vervangen worden.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Base path = /<repositorynaam>/ (hoofdlettergevoelig op Pages).
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Controleer build-output
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          grep -q 'src="/${{ github.event.repository.name }}/assets/' dist/index.html
          grep -q 'href="/${{ github.event.repository.name }}/manifest.webmanifest"' dist/index.html
          grep -q '"scope":"./"' dist/manifest.webmanifest
          grep -q '"start_url":"./"' dist/manifest.webmanifest
          grep -q 'url:"index.html"' dist/sw.js
          # Geen absolute paden naar de domeinroot (buiten de app-scope).
          ! grep -REn '(src|href)="/(assets|icons)/' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
